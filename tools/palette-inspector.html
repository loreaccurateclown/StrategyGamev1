<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kenney tiny-battle palette inspector</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #16181d;
        color: #d7dae0;
        font: 12px/1.3 ui-monospace, Consolas, monospace;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      #grid {
        display: grid;
        grid-template-columns: repeat(10, 78px);
        gap: 6px;
      }
      .cell {
        background: #0b0c0f;
        border: 1px solid #2a2e36;
        padding: 3px;
        text-align: center;
      }
      .cell canvas {
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
        display: block;
        margin: 0 auto;
        background: #000;
      }
      .cell b {
        display: block;
        color: #ffd34d;
        font-size: 13px;
        margin-top: 2px;
      }
      .cell i {
        display: block;
        color: #8b929e;
        font-style: normal;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <div id="grid"></div>
    <script>
      const TILE = 16;
      const SPACING = 1;
      const COLUMNS = 18;
      const TOTAL = 198;
      const PER_PAGE = 60;
      const ZOOM = 4;

      const page = Number(new URLSearchParams(location.search).get("page") ?? 0);
      const start = page * PER_PAGE;
      const end = Math.min(start + PER_PAGE, TOTAL);

      document.getElementById("title").textContent =
        `Tiles ${start}-${end - 1} of 0-${TOTAL - 1}  (label = 0-based index; gid = index + 1)`;

      const img = new Image();
      img.src = "../assets/import/kenney_tiny-battle/Tilemap/tilemap.png";

      img.onload = () => {
        const grid = document.getElementById("grid");
        for (let index = start; index < end; index++) {
          const col = index % COLUMNS;
          const row = Math.floor(index / COLUMNS);
          const canvas = document.createElement("canvas");
          canvas.width = TILE * ZOOM;
          canvas.height = TILE * ZOOM;
          const ctx = canvas.getContext("2d");
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(
            img,
            col * (TILE + SPACING),
            row * (TILE + SPACING),
            TILE,
            TILE,
            0,
            0,
            TILE * ZOOM,
            TILE * ZOOM
          );
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.appendChild(canvas);
          const b = document.createElement("b");
          b.textContent = String(index);
          cell.appendChild(b);
          const i = document.createElement("i");
          i.textContent = "gid " + (index + 1);
          cell.appendChild(i);
          grid.appendChild(cell);
        }
      };
    </script>
  </body>
</html>
